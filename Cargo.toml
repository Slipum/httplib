[package]
name = "httplib"
version = "1.3.1"
edition = "2021"
authors = ["Slipum"]
description = "Lightweight, synchronous, and multi-threaded Rust library for building fast HTTP servers from scratch."
license = "MIT"
repository = "https://github.com/Slipum/httplib"
readme = "README.md"
keywords = ["http", "server", "web", "framework", "router"]
categories = ["web-programming::http-server", "network-programming"]
exclude = [
    ".github",
    "examples",
    "Cargo.lock",
    ".gitignore",
]

[dependencies]
chrono = "0.4"

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"