[package]
name = "httplib"
version = "1.2.1"
edition = "2021"
authors = ["Slipum"]
description = "Lightweight HTTP server and router built in Rust"
license = "MIT"
repository = "https://github.com/Slipum/httplib"
readme = "README.md"
keywords = ["http", "server", "web", "framework", "router"]
categories = ["web-programming::http-server", "network-programming"]
exclude = [
    ".github/",
    "examples/",
]

[dependencies]
chrono = "0.4"

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"