name: Publish to crates.io and GitHub Release

on:
  release:
    types: [published]

jobs:
  publish:
    name: Build, Test, Publish & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify version matches tag
        run: |
          CARGO_VERSION=$(grep -m 1 '^version' Cargo.toml | cut -d '"' -f 2)
          TAG_VERSION=${GITHUB_REF_NAME#v}
          echo "Cargo version: $CARGO_VERSION"
          echo "Tag version: $TAG_VERSION"
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Версия в Cargo.toml ($CARGO_VERSION) не совпадает с тегом ($TAG_VERSION)!"
            exit 1
          fi

      - name: Run tests
        run: cargo test --all-targets

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}